    name_ko: 서울
    transport: transit
    wikivoyage_en: [Seoul, Seoul/Jongno, Seoul/Jung, Seoul/Gangnam-Seocho, Seoul/Seodaemun-Mapo]
    wikivoyage_ko: [서울]
  - id: jeju
