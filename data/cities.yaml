# Supported cities for RAG ingestion.
# - id: stable key used in metadata filters (city)
# - name_ko: display name
# - transport: default transport (car / taxi / transit), see SERVICE.md section 7
# - wikivoyage_en: English Wikivoyage page titles (main page + districts with listings)
# - wikivoyage_ko: Korean Wikivoyage page titles (mostly short stubs; optional)

cities:
